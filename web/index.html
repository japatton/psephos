<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Psephos</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/theme.css">
<script src="/splash.js"></script>
<script src="/vendor/d3.min.js" defer></script>
<script type="module" src="/app.js" defer></script>
</head>
<body>
<!-- First in the body so it is the first thing painted. Decorative: hidden
     from assistive tech, nothing focusable, and the app beneath it is live. -->
<div class="splash" id="splash" aria-hidden="true">
  <img class="splash-mark" src="/mark.png" alt="">
  <div class="splash-word">
    <span class="u"><i>ψ</i><b>PS</b></span>
    <span class="u"><i>ῆ</i><b>E</b></span>
    <span class="u"><i>φ</i><b>PH</b></span>
    <span class="u"><i>ο</i><b>O</b></span>
    <span class="u"><i>ς</i><b>S</b></span>
  </div>
  <div class="splash-rule"></div>
  <div class="brand splash-still">Psephos</div>
</div>

<div class="marking">Exercise data — constructed scenario, not real reporting</div>

<header class="topbar">
  <a class="brand-lockup" href="#/sessions" aria-label="Psephos"><img class="brand-mark" src="/mark.png" alt=""><span class="brand">Psephos</span></a>
  <nav id="nav">
    <a href="#/sessions" data-route="sessions">Sessions</a>
    <a href="#/plan"     data-route="plan">Hunt Plan</a>
    <a href="#/characterization" data-route="characterization">Characterization</a>
    <a href="#/map"      data-route="map">Network Map</a>
    <a href="#/timeline" data-route="timeline">Timeline</a>
    <a href="#/records"  data-route="records">Records</a>
    <a href="#/comms"    data-route="comms">Comms</a>
  </nav>
  <div class="topbar-right">
    <span class="pill" id="pending-pill" hidden></span>
    <div class="bell-wrap">
      <button id="bell" class="bell" title="Assignments and mentions" hidden>
        <span aria-hidden="true">◔</span><span class="bell-count" id="bell-count" hidden></span>
      </button>
      <div class="bell-panel" id="bell-panel" hidden></div>
    </div>
    <span class="conn" id="conn" title="live connection">●</span>
    <span class="who" id="who"></span>
    <button id="signout" class="signout" title="Sign out and use a different token">sign out</button>
  </div>
</header>

<main id="view"><div class="loading">Loading store…</div></main>
<aside id="drawer" class="drawer" hidden></aside>
<div id="toast" class="toast" hidden></div>
</body></html>
